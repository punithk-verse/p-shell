
name: P-Shell CI
on:
  push:
  pull_request:

jobs:
  build:
    name: Build and check warnings
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile P-Shell
        working-directory: P-shell/src
        run: gcc -Wall -Wextra -Wpedantic *.c -o pshell
